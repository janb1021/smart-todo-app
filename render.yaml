services:
  - type: web
    name: smart-todo-backend
    env: node
    plan: starter
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-todo-db
          property: connectionString
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: smart-todo-frontend
    env: static
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: smart-todo-backend
          type: web
          property: url

databases:
  - name: smart-todo-db
    databaseName: smarttodo
    user: smarttodo
    plan: starter